name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Run on multiple operating systems
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7.0.1

      - name: 'Setup Bun runtime'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: 'Install dependencies'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 'Build project'
        run: bun run build

      - name: 'Run tests with coverage'
        run: bun run test:coverage

      - name: 'SonarQube scan'
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
